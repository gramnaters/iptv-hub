name: HS Akamai Egress Probe (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Probe Akamai hotstar CDN from GitHub datacenter IP
        run: |
          python - <<'PY'
          import requests
          UA = "Hotstar;in.startv.hotstar/25.02.24.8.11169@Premium Plugx(Android/15)"
          url = "https://jcevents.hotstar.com/bpk-tv/082c75fa2fec61647e9192140d488d30/JioHotstar/082c75fa2fec61647e9192140d488d30.m3u8"
          tok = "hdntl=exp=1792667805~acl=%2f*~id=ef0cb8d6635fb2d058cf6b2e82b0ea56~data=hdntl~hmac=e7da29301fdbf5d8657fa1000b9f316df4aacf7c67a44e2ec3e822f2b36d3e60"

          # 1) streaming WITH the valid hdntl token
          try:
              r = requests.get(url, headers={"User-Agent": UA, "Referer": "https://www.hotstar.com/", "Origin": "https://www.hotstar.com", "Cookie": tok}, timeout=20)
              print("WITH_TOKEN:", r.status_code)
          except Exception as e:
              print("WITH_TOKEN: ERR", type(e).__name__, e)

          # 2) bare fetch (no token) — the minting style fetch
          try:
              r2 = requests.get(url, headers={"User-Agent": UA, "Referer": "https://www.hotstar.com/"}, timeout=20)
              print("BARE_FETCH:", r2.status_code)
          except Exception as e:
              print("BARE_FETCH: ERR", type(e).__name__, e)
          PY
