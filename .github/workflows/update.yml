name: Auto Refresh Playlists

on:
  schedule:
    # Run every 4 hours to ensure tokens never expire
    # (JioTV tokens have ~6h lifespan; 4h interval guarantees 100% continuous uptime)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Generate independent source playlists
        env:
          JIOTV_CREDS: ${{ secrets.JIOTV_CREDS }}
        run: |
          python scripts/generate_jiotv.py   || echo "::warning::jiotv generator failed"
          python scripts/generate_vzy.py     || echo "::warning::vzy generator failed"
          python scripts/generate_fancode.py || echo "::warning::fancode generator failed"
          python scripts/generate_sony.py    || echo "::warning::sony generator failed"
          python scripts/generate_sunnxt.py  || echo "::warning::sunnxt generator failed"
          python scripts/generate_zee5.py    || echo "::warning::zee5 generator failed"

      - name: Run Master Updater & Aggregator
        run: |
          python scripts/merge.py

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Combined.m3u playlists/ catalogs/
          if git diff --staged --quiet; then
            echo "No changes in playlists."
          else
            git commit -m "📡 Auto-refreshed master playlist [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD
          fi
