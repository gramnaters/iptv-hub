name: Auto Refresh Playlists

on:
  schedule:
    # Every 5 hours. WHY 5h: JioTV's __hdnea__ token and the JioHotstar
    # hdntl token both expire ~6h after they are minted, and the token is
    # baked into the playlist. A 24h cron left ~1300 of 1600 channels
    # holding a dead token for most of the day; 5h keeps the gap in the
    # day (the 20:00 -> 00:00 UTC step is 4h) safely inside the 6h life.
    # SonyLIV self-mints its ~12h hdnea token on this same run. VZY and
    # FanCode don't depend on this cadence and simply refresh along.
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pycryptodome

      - name: Trigger token mints (fallback to worker crons)
        env:
          JHS_MINT_SECRET: ${{ secrets.JHS_MINT_SECRET }}
          SONY_INGEST_SECRET: ${{ secrets.SONY_INGEST_SECRET }}
        run: |
          # Fallback for the Cloudflare worker crons. Each worker also mints on
          # its own schedule. We only mint when a token is within 8h of expiring,
          # and space the two mints apart, because Cloudflare Browser Rendering
          # rate-limits (429) rapid session creation. Minting on fresh tokens
          # every run was burning that limit for nothing.
          JHS_TTL=$(curl -fsS https://jhs.gramnaters.workers.dev/status 2>/dev/null \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('expiresInHours', 99)))" 2>/dev/null \
            || echo 99)
          if [ "${JHS_TTL:-99}" -lt 8 ]; then
            for i in 1 2 3; do
              if curl -fsS -X POST -H "Authorization: Bearer $JHS_MINT_SECRET" \
                https://jhs.gramnaters.workers.dev/mint; then break; fi
              echo "::warning::jhs mint attempt $i failed, retrying"
              sleep 12
            done
          fi

          SONY_TTL=$(curl -fsS https://sliv.gramnaters.workers.dev/health 2>/dev/null \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('ttl', 0)//3600))" 2>/dev/null \
            || echo 99)
          if [ "${SONY_TTL:-99}" -lt 8 ]; then
            for i in 1 2 3; do
              if curl -fsS -X POST -H "Authorization: Bearer $SONY_INGEST_SECRET" \
                https://sliv.gramnaters.workers.dev/mint; then break; fi
              echo "::warning::sonyliv mint attempt $i failed, retrying"
              sleep 12
            done
          fi

      - name: Generate independent source playlists
        run: |
          # Each script writes its own playlists/<name>.m3u, which merge.py
          # consumes. SonyLIV reads its hdnea token from the sliv worker (minted
          # via Browser Rendering, since Sony blocks the GitHub egress); VZY
          # solves its AES challenge and reads fresh ClearKey keys from its own
          # api.php; JioTV comes straight from the plugx public feed. Each
          # script leaves the previous playlist untouched if its upstream fails.
          python scripts/generate_vzy.py     || echo "::warning::vzy generator failed"
          python scripts/generate_fancode.py || echo "::warning::fancode generator failed"
          python scripts/generate_sony.py    || echo "::warning::sony generator failed"

      - name: Run Master Updater & Aggregator
        run: |
          python scripts/merge.py

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Combined.m3u playlists/
          if git diff --staged --quiet; then
            echo "No changes in playlists."
          else
            git commit -m "📡 Auto-refreshed master playlist [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD
          fi
