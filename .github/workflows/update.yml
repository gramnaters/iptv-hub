name: refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: sources (comma list, empty = whatever is due)
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pycryptodome
      - name: refresh due sources
        env:
          SLIV_URL: ${{ secrets.SLIV_URL }}
          JHS_URL: ${{ secrets.JHS_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/refresh.py --only "${{ github.event.inputs.only }}"
