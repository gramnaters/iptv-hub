name: Auto Refresh 24h Playlists

on:
  schedule:
    # Runs once every 24 hours at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Generate independent source playlists
        run: |
          # Each of these writes its own playlists/<name>.m3u from
          # channels/<name>_*.json and is consumed by merge.py.
          # Failures are non-fatal: merge.py falls back to the public feed.
          python scripts/generate_jiotv.py || echo "::warning::jiotv generator failed"
          python scripts/generate_vzy.py   || echo "::warning::vzy generator failed"
          python scripts/generate_fancode.py || echo "::warning::fancode generator failed"

      - name: Run Master Updater & Aggregator
        run: |
          python scripts/merge.py

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Combined.m3u playlists/ channels/
          if git diff --staged --quiet; then
            echo "No changes in playlists."
          else
            git commit -m "📡 Auto-refreshed master playlist [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD
          fi
