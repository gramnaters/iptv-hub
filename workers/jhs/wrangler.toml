name = "jhs"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5187ba2fa9d1d3c76911594de4a63a0d"
workers_dev = true

# Token store (hdntl + mint time). Written by POST /mint, read on every request.
[[kv_namespaces]]
binding = "HS_CACHE"
id = "10025fbf51d14452867dca0bdc2a6f80"

# Browser Run: the only egress that Akamai accepts for the Hotstar BFF.
[browser]
binding = "BROWSER"

[observability]
enabled = true

[vars]
MINT_ID = "1540072843"
